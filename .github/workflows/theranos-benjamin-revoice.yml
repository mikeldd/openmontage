name: Theranos Benjamin Revoice

on:
  push:
    branches:
      - production/theranos-episode-1
    paths:
      - ".github/workflows/theranos-benjamin-revoice.yml"

permissions:
  contents: read
  actions: read

jobs:
  revoice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download final OpenMontage master
        uses: actions/download-artifact@v4
        with:
          name: healthcare-autopsy-theranos-openmontage-final
          path: final-master
          github-token: ${{ github.token }}
          repository: mikeldd/openmontage
          run-id: 37517631399

      - name: Download full OpenMontage assets
        uses: actions/download-artifact@v4
        with:
          name: theranos-openmontage-full-assets
          path: full-assets
          github-token: ${{ github.token }}
          repository: mikeldd/openmontage
          run-id: 37511241829

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download approved Benjamin narration
        run: |
          curl -L --fail --retry 3 --output benjamin.m4a 'https://production-273614-media-export.storage.googleapis.com/3c2b02b9-a0a7-42bd-a0d4-6c70d6dc7cd5/original.m4a?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20261007%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261007T095243Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-'
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 benjamin.m4a

      - name: Locate OpenMontage media
        id: media
        run: |
          MASTER=$(find final-master -type f -name 'healthcare_autopsy_theranos_episode_1.mp4' -print -quit)
          MUSIC=$(find full-assets -type f -name 'documentary_underscore.mp3' -print -quit)
          test -n "$MASTER"
          test -n "$MUSIC"
          echo "master=$MASTER" >> "$GITHUB_OUTPUT"
          echo "music=$MUSIC" >> "$GITHUB_OUTPUT"

      - name: Retime Benjamin narration to approved OpenMontage chapter boundaries
        run: |
          # Benjamin source section boundaries from the verified Descript transcript:
          # 0-21.610, 21.610-60.029, 60.029-90.859, 90.859-153.680,
          # 153.680-264.409, 264.409-307.049, 307.049-339.850,
          # 339.850-354.740, 354.740-360.219
          # Target OpenMontage section durations:
          # 20, 45, 50, 50, 85, 35, 30, 20, 10 seconds
          ffmpeg -y -i benjamin.m4a -filter_complex "\
          [0:a]atrim=start=0:end=21.610,asetpts=PTS-STARTPTS,atempo=1.0805[a0];\
          [0:a]atrim=start=21.610:end=60.029,asetpts=PTS-STARTPTS,atempo=0.8538[a1];\
          [0:a]atrim=start=60.029:end=90.859,asetpts=PTS-STARTPTS,atempo=0.6166[a2];\
          [0:a]atrim=start=90.859:end=153.680,asetpts=PTS-STARTPTS,atempo=1.2564[a3];\
          [0:a]atrim=start=153.680:end=264.409,asetpts=PTS-STARTPTS,atempo=1.3027[a4];\
          [0:a]atrim=start=264.409:end=307.049,asetpts=PTS-STARTPTS,atempo=1.2183[a5];\
          [0:a]atrim=start=307.049:end=339.850,asetpts=PTS-STARTPTS,atempo=1.0934[a6];\
          [0:a]atrim=start=339.850:end=354.740,asetpts=PTS-STARTPTS,atempo=0.7445[a7];\
          [0:a]atrim=start=354.740:end=360.219,asetpts=PTS-STARTPTS,atempo=0.5479[a8];\
          [a0][a1][a2][a3][a4][a5][a6][a7][a8]concat=n=9:v=0:a=1,apad=pad_dur=1,atrim=duration=345[benjamin]" \
          -map "[benjamin]" -ar 48000 -ac 2 -c:a pcm_s16le benjamin_openmontage_timed.wav

      - name: Rebuild soundtrack with Benjamin and original music
        env:
          MUSIC: ${{ steps.media.outputs.music }}
        run: |
          ffmpeg -y -i benjamin_openmontage_timed.wav -stream_loop -1 -i "$MUSIC" -filter_complex "\
          [1:a]volume=0.055,afade=t=in:d=2,afade=t=out:st=340:d=5[m];\
          [0:a][m]amix=inputs=2:duration=first:dropout_transition=2,loudnorm=I=-14:LRA=11:TP=-1.5[a]" \
          -map "[a]" -t 345 -c:a aac -b:a 192k soundtrack.m4a

      - name: Create revised master
        env:
          MASTER: ${{ steps.media.outputs.master }}
        run: |
          ffmpeg -y -i "$MASTER" -i soundtrack.m4a -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a copy -t 342.676 -movflags +faststart \
            healthcare_autopsy_theranos_episode_1_benjamin.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json healthcare_autopsy_theranos_episode_1_benjamin.mp4 > revised_probe.json
          cat revised_probe.json

      - name: Upload revised episode
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-autopsy-theranos-benjamin-final
          path: |
            healthcare_autopsy_theranos_episode_1_benjamin.mp4
            revised_probe.json
          if-no-files-found: error
          retention-days: 14
